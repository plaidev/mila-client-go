    TriggerShardKeyMapMergeRequest:
      type: object
      properties:
        jobId:
          type: string
          description: 'Optional caller-supplied job ID. When omitted, the server
            generates a UUID. Supplying a stable ID lets callers correlate jobs with
            their own systems and makes retries idempotent: calling triggerShardKeyMapMerge
            again with the same jobId returns the existing job without re-queueing.'
          example: my-system:batch-42
          nullable: true
        mapLookbackMillis:
          type: integer
          format: int64
        shardKeyMapTableName:
          type: string
        tableName:
          type: string
      required:
      - shardKeyMapTableName
